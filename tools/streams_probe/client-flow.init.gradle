// Opt-in client-only flow observer. It does not include tools/streams_probe/java,
// so StreamsReflowingProbe and its server work are absent from this run.
gradle.projectsEvaluated {
    def neoforge = gradle.rootProject.findProject(':neoforge')
    if (neoforge != null) {
        neoforge.sourceSets.main.java.srcDir(new File(gradle.rootProject.rootDir, 'tools/streams_probe/client-java'))
        def clientDir = gradle.rootProject.findProperty('tdClientDir')
        if (clientDir != null) {
            neoforge.extensions.getByName('neoForge').runs.named('client') {
                gameDirectory = neoforge.file(clientDir)
            }
        }
        neoforge.tasks.named('runClient') {
            if (gradle.rootProject.hasProperty('tdClientFlowProbe')) {
                systemProperty 'td.clientFlowProbe', gradle.rootProject.property('tdClientFlowProbe').toString()
            }
            if (gradle.rootProject.hasProperty('tdClientFlowProbeInterval')) {
                systemProperty 'td.clientFlowProbe.interval', gradle.rootProject.property('tdClientFlowProbeInterval').toString()
            }
        }
    }
}
